name: rice-motif
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Deep learning (GPU build; drop pytorch-cuda for a CPU-only install)
  - pytorch>=2.0
  - pytorch-cuda=11.8
  # Scientific stack
  - numpy>=1.24
  - pandas>=1.5
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
